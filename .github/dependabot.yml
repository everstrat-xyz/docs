version: 2

multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: "cron"
      cronjob: "0 9 * * *"
      timezone: "Europe/Warsaw"
    open-pull-requests-limit: 1
    commit-message:
      prefix: "chore"
      include: "scope"

updates:
  - package-ecosystem: "bun"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "dependencies"
    cooldown:
      default-days: 7
    # Multi-ecosystem groups cover version updates; security updates group here.
    groups:
      security-updates:
        applies-to: "security-updates"
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "dependencies"
    cooldown:
      default-days: 7
    groups:
      security-updates:
        applies-to: "security-updates"
        patterns: ["*"]
