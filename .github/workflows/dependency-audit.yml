name: Dependency audit

on:
  pull_request:
    paths:
      - ".github/dependabot.yml"
      - ".github/workflows/dependency-audit.yml"
      - "package.json"
      - "bun.lock"
      - "bunfig.toml"
      - ".bun-version"
      - ".npmrc"
  push:
    branches: ["main"]
    paths:
      - ".github/dependabot.yml"
      - ".github/workflows/dependency-audit.yml"
      - "package.json"
      - "bun.lock"
      - "bunfig.toml"
      - ".bun-version"
      - ".npmrc"
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bun-audit:
    name: Bun audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.3"
          no-cache: true
      - name: Audit all locked Bun dependencies
        shell: bash
        env:
          BUN_CONFIG_REGISTRY: https://registry.npmjs.org/
        run: |
          set -euo pipefail

          audit_dir="$(mktemp -d "$RUNNER_TEMP/bun-audit.XXXXXX")"
          trap 'rm -rf "$audit_dir"' EXIT

          # Only dependency data comes from the pull request.
          test -f bun.lock
          test ! -L bun.lock
          cp -- bun.lock "$audit_dir/bun.lock"

          printf '%s\n' \
            '{"name":"dependency-audit","private":true}' \
            > "$audit_dir/package.json"

          cat > "$audit_dir/bunfig.toml" <<'EOF'
          env = false
          [install]
          registry = "https://registry.npmjs.org/"
          EOF

          cd "$audit_dir"
          bun audit --audit-level=low
